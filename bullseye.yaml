    - 'ENT-008 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-008 (P2). Status: observed fact. two ledgers describe the same IDs with different status and different T2 identity. Agents following `/target` still look for `docs/targets.yaml`. The docs-skill directory is a published skill, so a stale markdown ledger rides along forever unless excluded. A fix to T1 in `bullseye.yaml` does not update `skills/docs/targets.md`, and vice versa. Remediation: delete `skills/docs/targets.md` from the install tree (or rsync-exclude it); change `/target` and `/cv` prose to `bullseye.yaml`; refresh 🎯T1 acceptance to the thin-shim `/cv` that actually exists, then achieve or rewrite T1. Blast: `/cv` and `/target` on this repo; any consumer of the docs skill who treats `targets.md` as an example. Report: docs/audits/entropy-audit-2026-08-22.md.'
