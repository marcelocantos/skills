    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - README lines for demo/expenses/remind contain real sentences; a dirty untracked file outside that list is not in `git diff --cached` after a dry-run publish.
    - 'ENT-007 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-007 (P2). Status: observed fact. folded YAML scalars are valid skill front matter (Claude reads the folded block). The publisher''s first-line regex is a second parser that disagrees. `git add -A` will stage whatever is in the worktree (including an in-progress audit report, local debris rsync copied, or `__pycache__` if excludes ever change) and push it. Remediation: parse YAML front matter (or strip `>` / `|` and join the folded block); `git add` an explicit path list (`skills/`, `CLAUDE.md`, `AGENTS.md`, `convergence.md`, `README.md`); never `git add -A`. Blast: README as the public catalogue; every publish commit; accidental ship of unrelated dirty files. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-007
    - p2
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
