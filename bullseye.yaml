  T4.5:
    name: '`/commit` gather is bash 3.2-safe despite `env bash`'
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`PATH` with `/bin/bash` shimmed as `bash`; `./skills/commit/gather.sh` exits 0 in this repo.'
    - 'ENT-005 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-005 (P2). Status: observed fact. empty-array `"${arr[@]}"` under `set -u` is unbound on bash <4.4. Even if that were guarded, `mapfile` and `${var,,}` are bash 4+. The shebang hides this on the author''s Mac because Homebrew bash 5 is first on `PATH`. Any invocation that actually uses `/bin/bash` (CI macOS runner, `bash` wrapper, PATH without Homebrew) aborts `/commit` before secret scanning. Remediation: use `${paths[@]+"${paths[@]}"}`, replace `mapfile` with a `while read` loop, replace `${bn,,}` with `tr`. Add the bash 3.2 CI job the release skill already specifies. Blast: `/commit` in every repo; similar patterns may exist in other `env bash` scripts not exercised under 3.2 in this audit (residue). Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-005
    - p2
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
