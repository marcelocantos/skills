  T4.1:
    name: Three snapshots of the skill tree agree
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - '`rsync -ani --exclude=''.*'' --delete ~/.claude/skills/ skills/` is empty after publish; `git rev-parse origin/master` equals the publish commit; `test -d skills/entropy-audit`.'
    - 'ENT-001 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-001 (P1). Status: observed fact. the git repo is not the working trunk. Skill edits land in `~/.claude/skills/` and reach GitHub only when someone runs `!publish`. That command pushes the checked-out branch. GitHub''s default branch can lag both the live tree and the last publish branch. Consumers of `https://github.com/marcelocantos/skills` therefore do not see `entropy-audit` or the bullseye-ledger commit rail. Remediation: make publish a fast-forward onto `master` (or retarget default branch to the publish branch); add an exclude list (`__pycache__`, `docs/targets.md` debris); fail publish if HEAD is not the default branch unless overridden. Blast: any clone, fork, or agent that treats GitHub as the skill source; future `/republish-skills` on the wrong branch; comparisons of "what''s published" vs "what agents run". Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-001
    - p1
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
