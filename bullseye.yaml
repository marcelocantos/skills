    - entropy-audit
    - ent-008
    - p2
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
  T4.9:
    name: Memory-path.sh `--ensure` is a constant inside `[[ ]]`
    status: identified
    value: 0.0
    cost: 0.0
    acceptance:
    - with `ensure=0` and a missing grok dir, script prints the Claude path if that dir exists; `shellcheck` SC2078 gone.
    - 'ENT-009 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-009 (P2). Status: observed fact. inside `[[ ]]`, `(( ensure ))` is grouping plus the literal word `ensure`, which is always true. When `python3` exists, `grok_dir` is always set, so the Claude fallback (`skills/_shared/memory-path.sh:35-36`) is dead. `--ensure` does not change the branch; it only affects the later `mkdir`. Remediation: `if [[ -n "$grok_dir" ]] && { [[ -d "$grok_dir" ]] || (( ensure )); }; then` Blast: any skill using `_shared/memory-path.sh` for session memory when a Grok session directory is absent. Report: docs/audits/entropy-audit-2026-08-22.md.'
    tags:
    - entropy-audit
    - ent-009
    - p2
    origin: entropy-audit 2026-08-22
    discovered: 2026-08-22
