    - 'ENT-006 in docs/audits/entropy-audit-2026-08-22.md is closed: the evidence cited there no longer reproduces on the shipped path'
    context: 'Entropy-audit ENT-006 (P2). Status: observed fact. the validator that other repos use to declare posture does not have a first-class "no hygiene.yaml" outcome. Missing Makefile is an uncaught exception rather than `ok=False`. `shell=True` on `command:` evidence will execute whatever string a `hygiene.yaml` contains. Remediation: if the file is missing, print `hygiene posture not declared` and exit 2 (distinct from drift). Guard `Makefile` reads. Avoid `shell=True` or restrict `command:` to an argv list. Blast: every `/hygiene` invocation; fleet `hygiene_portfolio.py` already catches per-repo exceptions (`skills/hygiene/hygiene_portfolio.py:55-58`) so the portfolio degrades, but the… Report: docs/audits/entropy-audit-2026-08-22.md.'
